project_name: diagramdesk
project_type: application
risk_tier: medium
repository_model: single-repo
repository_policy:
  default_target_branch: main
  publish_preference: Push completed changes directly to main unless Adam explicitly requests a branch or pull request.
owner:
  name: Adam Goodwin
  role: owner
technical_lead:
  name: codex session
  role: technical-lead
status: active
# Owner decision, 2026-11-06. The build-to-sale lifecycle standard doesn't apply, because this isn't being sold.
distribution:
  previous_name: Mermaid Tool, until 2026-11-06
  commercial: false
  channel: free through GitHub
  # Owner decision, 2026-11-08. Replaces "occasional tool, no roadmap" from the 2026-09-05 portfolio review.
  stage: full release
  code_signing: none
  code_signing_notes: Accepted risk R-007. Users get system warnings, and Smart App Control may block the Windows installer.
environments:
  - dev
  - staging
  - prod
data_classification:
  handles_sensitive_data: false
  handles_money: false
  notes: ""
controls:
  required_docs:
    - README.md
    - docs/architecture.md
    - docs/manual.md
    - docs/roadmap.md
    - docs/deployment-guide.md
    - docs/runbook.md
    - docs/CHANGELOG.md
    - docs/risks/risk-register.md
  machine_enforcement:
    - required-file-check
    - lint
    - tests
    - secret-scan
exceptions: []
agent_controls:
  applicable: false
  autonomy_level: A0
  model_registry: []
  prompt_registry: []
